name: Bug report
description: Something Primer did that it should not have done.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security
        vulnerabilities — see [SECURITY.md](https://github.com/QuinntyneBrown/primer/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did Primer do, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and its full output.
      render: console
      placeholder: |
        $ primer init --dry-run --verbosity diagnostic
        ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `primer --version`.
      placeholder: 0.1.0+c5a160c
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: repository
    attributes:
      label: Repository shape
      description: >
        What does the target repository look like? Stack, marker files, whether it is
        a worktree or a monorepo, anything unusual about its layout.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed any secrets from the output above.
          required: true
